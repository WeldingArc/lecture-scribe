<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>강의 받아쓰기</title>
<style>
  @font-face { font-family: "Pretendard"; font-weight: 200; font-display: swap;
    src: local("Pretendard ExtraLight"), local("Pretendard-ExtraLight"), url("fonts/Pretendard-ExtraLight.otf") format("opentype"); }
  @font-face { font-family: "Pretendard"; font-weight: 300; font-display: swap;
    src: local("Pretendard Light"), local("Pretendard-Light"), url("fonts/Pretendard-Light.otf") format("opentype"); }
  @font-face { font-family: "Pretendard"; font-weight: 400; font-display: swap;
    src: local("Pretendard Regular"), local("Pretendard-Regular"), url("fonts/Pretendard-Regular.otf") format("opentype"); }
  :root {
    --bg: #0d1220;
    --ink: #ebe6db;
    --ink-2: #c2bcb0;
    --muted: #7d8598;
    --faint: #4b5265;
    --line: rgba(235, 230, 219, 0.09);
    --line-2: rgba(235, 230, 219, 0.18);
    --accent: #c9a96b;
    --rec: #c46a5c;
    --ok: #8fae8b;
    --font: "Pretendard", "Pretendard Variable", "Apple SD Gothic Neo", -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font);
    color: var(--ink);
    background:
      radial-gradient(1100px 520px at 50% -12%, rgba(201, 169, 107, 0.075), transparent 62%),
      radial-gradient(900px 640px at 50% 118%, rgba(70, 92, 150, 0.12), transparent 62%),
      var(--bg);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  /* ---------- header ---------- */
  .top {
    position: fixed; inset: 0 0 auto 0; z-index: 5;
    padding: 40px 16px 26px;
    text-align: center;
    background: linear-gradient(to bottom, var(--bg) 76%, rgba(13, 18, 32, 0));
    pointer-events: none;
  }
  .brand {
    font-size: 12.5px; font-weight: 400; letter-spacing: 0.42em; text-indent: 0.42em;
    color: rgba(235, 230, 219, 0.56);
  }
  .status {
    margin-top: 12px; height: 20px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    font-size: 13.5px; font-weight: 300; color: var(--muted); letter-spacing: 0.02em;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
  body.engine-ready .dot { background: var(--ok); }
  body.engine-loading .dot { animation: pulse 1.4s ease-in-out infinite; }
  body.recording .dot { background: var(--rec); box-shadow: 0 0 12px rgba(196, 106, 92, 0.7); animation: pulse 1.8s ease-in-out infinite; }
  body.finishing .dot { background: var(--accent); animation: pulse 1s ease-in-out infinite; }
  #timer { font-variant-numeric: tabular-nums; color: var(--ink-2); letter-spacing: 0.06em; }
  #timer:empty { display: none; }
  .sep { color: var(--faint); }
  .sep:has(+ #timer:empty) { display: none; }
  .meter {
    width: 180px; height: 1px; margin: 16px auto 0;
    background: var(--line); position: relative; overflow: hidden;
  }
  .meter i {
    position: absolute; inset: 0;
    background: linear-gradient(to right, transparent, var(--accent), transparent);
    transform: scaleX(0); transition: transform 0.12s linear; opacity: 0.9;
  }

  /* ---------- transcript ---------- */
  main {
    position: absolute; inset: 0;
    overflow-y: auto; overflow-x: hidden;
    padding: 150px 16px 230px;
    scroll-behavior: smooth;
  }
  main::-webkit-scrollbar { width: 9px; }
  main::-webkit-scrollbar-thumb { background: rgba(235, 230, 219, 0.1); border-radius: 9px; border: 3px solid transparent; background-clip: padding-box; }
  #transcript { max-width: 700px; margin: 0 auto; }
  .seg {
    text-align: center; padding: 13px 0;
    animation: rise 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
    transition: opacity 0.6s ease;
  }
  body.recording .seg:not(:last-of-type) { opacity: 0.62; }
  .seg time {
    display: block; margin-bottom: 6px;
    font-size: 11px; letter-spacing: 0.18em; text-indent: 0.18em;
    color: var(--faint); font-variant-numeric: tabular-nums; font-weight: 400;
  }
  body.no-ts .seg time { display: none; }
  .seg p {
    font-size: clamp(18px, 2.15vw, 22px); line-height: 1.78; font-weight: 300;
    word-break: keep-all; overflow-wrap: anywhere;
    user-select: text; -webkit-user-select: text; cursor: text;
  }
  .seg.interim p { color: var(--muted); }
  .seg.interim p::after {
    content: ""; display: inline-block; width: 2px; height: 0.95em; margin-left: 5px;
    background: var(--accent); vertical-align: -0.12em; animation: blink 1.05s steps(1) infinite;
  }
  .seg p::selection, .seg time::selection { background: rgba(201, 169, 107, 0.32); }
  .seg.cue time { color: var(--accent); }
  .seg.cue p {
    display: inline; color: var(--ink);
    background: linear-gradient(transparent 72%, rgba(201, 169, 107, 0.24) 72%, rgba(201, 169, 107, 0.24) 92%, transparent 92%);
    -webkit-box-decoration-break: clone; box-decoration-break: clone;
  }
  body.recording .seg.cue { opacity: 1; }
  .seg.flash p { animation: flash 1.6s ease; }
  @keyframes flash { 0%, 60% { background-color: rgba(201, 169, 107, 0.22); } 100% { background-color: transparent; } }
  .cuechip {
    position: fixed; top: 118px; left: 50%; z-index: 6; transform: translate(-50%, -6px);
    opacity: 0; pointer-events: none; max-width: calc(100% - 32px);
    padding: 7px 16px; border-radius: 999px; font-size: 12.5px; font-weight: 400; color: var(--accent);
    background: rgba(32, 38, 56, 0.92); border: 1px solid rgba(201, 169, 107, 0.35);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: opacity 0.3s, transform 0.3s;
  }
  .cuechip.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .saved .cues { margin: 16px auto 0; max-width: 520px; font-size: 14px; font-weight: 300; line-height: 1.7; color: var(--ink); word-break: keep-all; }
  .saved .cues em { display: block; font-style: normal; font-size: 11.5px; letter-spacing: 0.24em; text-indent: 0.24em; color: var(--accent); margin-bottom: 6px; }

  .empty {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 120px 24px 220px; pointer-events: none;
    transition: opacity 0.5s ease;
  }
  body.has-text .empty { opacity: 0; }
  .wave { width: 120px; height: 36px; margin-bottom: 30px; opacity: 0.85; }
  .wave path { fill: none; stroke: var(--accent); stroke-width: 1.2; stroke-linecap: round; }
  .empty h1 {
    font-size: clamp(25px, 3.6vw, 33px); font-weight: 200; line-height: 1.5;
    letter-spacing: -0.01em; color: var(--ink);
  }
  .empty p { margin-top: 18px; font-size: 14.5px; font-weight: 300; color: var(--muted); line-height: 1.75; word-break: keep-all; }

  .divider {
    text-align: center; margin: 20px auto; font-size: 12px; letter-spacing: 0.18em; text-indent: 0.18em;
    color: var(--accent); opacity: 0.85; font-weight: 400;
  }
  .dl { margin-top: 26px; display: none; flex-direction: column; align-items: center; gap: 10px; }
  body.downloading .dl { display: flex; }
  body.downloading .empty p.hint { display: none; }
  .dlbar { width: min(320px, 70vw); height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .dlbar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.4s ease; }
  .dl span { font-size: 13px; color: var(--muted); font-weight: 300; font-variant-numeric: tabular-nums; }
  .panel {
    position: fixed; inset: 0; z-index: 15; display: none; align-items: center; justify-content: center;
    background: rgba(13, 18, 32, 0.72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .panel.show { display: flex; }
  .card {
    width: min(500px, calc(100% - 32px)); padding: 26px 24px 20px; border-radius: 18px; text-align: center;
    background: rgba(30, 38, 58, 0.98); border: 1px solid var(--line-2); box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
  }
  .card h2 { font-size: 15px; font-weight: 400; letter-spacing: 0.24em; text-indent: 0.24em; color: var(--accent); }
  .card p { margin-top: 10px; font-size: 13.5px; font-weight: 300; color: var(--muted); line-height: 1.7; word-break: keep-all; }
  .card textarea {
    margin-top: 16px; width: 100%; min-height: 108px; resize: vertical; padding: 12px 14px; border-radius: 12px;
    background: rgba(13, 18, 32, 0.6); border: 1px solid var(--line-2); color: var(--ink);
    font: 300 14.5px/1.7 var(--font); outline: none; user-select: text; -webkit-user-select: text;
  }
  .card textarea:focus { border-color: rgba(201, 169, 107, 0.5); }
  .card .acts { margin-top: 16px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .saved {
    text-align: center; margin: 34px auto 10px; padding-top: 30px; max-width: 420px;
    border-top: 1px solid var(--line); animation: rise 0.6s ease;
  }
  .saved b { display: block; font-size: 13px; font-weight: 400; letter-spacing: 0.32em; text-indent: 0.32em; color: var(--accent); }
  .saved span { display: block; margin-top: 8px; font-size: 13.5px; font-weight: 300; color: var(--muted); }
  .saved .acts { margin-top: 16px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

  /* ---------- dock ---------- */
  .dock {
    position: fixed; inset: auto 0 0 0; z-index: 5;
    padding: 64px 16px 26px; text-align: center;
    background: linear-gradient(to top, var(--bg) 58%, rgba(13, 18, 32, 0));
  }
  .row { display: flex; align-items: center; justify-content: center; gap: clamp(14px, 4vw, 34px); }
  .ghost {
    min-width: 108px; padding: 10px 18px; border-radius: 999px;
    border: 1px solid var(--line-2); color: rgba(235, 230, 219, 0.82);
    font-size: 14px; font-weight: 400; letter-spacing: 0.04em;
    transition: background 0.2s, border-color 0.2s, opacity 0.2s;
  }
  .ghost:hover:not(:disabled) { background: rgba(235, 230, 219, 0.05); border-color: rgba(235, 230, 219, 0.32); }
  .ghost:disabled { opacity: 0.32; cursor: default; }
  .ghost.small { min-width: 0; padding: 7px 14px; font-size: 13px; }
  .recwrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .rec {
    width: 76px; height: 76px; border-radius: 50%;
    border: 1.5px solid rgba(235, 230, 219, 0.34);
    display: grid; place-items: center;
    background: radial-gradient(circle at 50% 38%, rgba(255, 255, 255, 0.05), transparent 70%);
    transition: border-color 0.3s, opacity 0.3s, transform 0.15s;
  }
  .rec:hover:not(:disabled) { border-color: rgba(235, 230, 219, 0.6); }
  .rec:active:not(:disabled) { transform: scale(0.96); }
  .rec:disabled { opacity: 0.35; cursor: default; }
  .rec .core {
    width: 26px; height: 26px; border-radius: 50%; background: var(--rec);
    box-shadow: 0 0 22px rgba(196, 106, 92, 0.35);
    transition: width 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), height 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), border-radius 0.35s;
  }
  body.recording .rec { border-color: rgba(196, 106, 92, 0.65); animation: breathe 2.6s ease-in-out infinite; }
  body.recording .rec .core { width: 22px; height: 22px; border-radius: 5px; }
  body.finishing .rec .core { background: var(--accent); width: 18px; height: 18px; border-radius: 50%; animation: pulse 1s ease-in-out infinite; }
  .reclabel { font-size: 12px; letter-spacing: 0.26em; text-indent: 0.26em; color: var(--muted); font-weight: 400; }
  .row2 {
    margin-top: 18px; display: flex; gap: 22px; justify-content: center; align-items: center;
    font-size: 12.5px; color: var(--muted); font-weight: 300;
  }
  .toggle { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; }
  .toggle input { display: none; }
  .toggle .sw { width: 26px; height: 15px; border-radius: 15px; background: var(--line-2); position: relative; transition: background 0.25s; }
  .toggle .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 11px; height: 11px; border-radius: 50%; background: var(--ink-2); transition: transform 0.25s; }
  .toggle input:checked + .sw { background: rgba(201, 169, 107, 0.55); }
  .toggle input:checked + .sw::after { transform: translateX(11px); background: var(--ink); }
  .link { font-size: 12.5px; color: var(--muted); font-weight: 300; border-bottom: 1px solid transparent; transition: color 0.2s, border-color 0.2s; }
  .link:hover:not(:disabled) { color: var(--ink-2); border-color: var(--line-2); }
  .link:disabled { opacity: 0.35; cursor: default; }
  .dotsep { color: var(--faint); }

  /* ---------- overlays ---------- */
  .latest {
    position: fixed; left: 50%; bottom: 196px; z-index: 6;
    transform: translate(-50%, 8px); opacity: 0; pointer-events: none;
    padding: 7px 15px; border-radius: 999px; font-size: 12.5px; color: var(--ink-2);
    background: rgba(28, 35, 54, 0.9); border: 1px solid var(--line-2);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: opacity 0.25s, transform 0.25s;
  }
  .latest.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .toast {
    position: fixed; left: 50%; bottom: 196px; z-index: 7;
    transform: translate(-50%, 10px); opacity: 0; pointer-events: none;
    padding: 11px 20px; border-radius: 999px; max-width: calc(100% - 32px);
    font-size: 13.5px; font-weight: 300; color: var(--ink); text-align: center;
    background: rgba(30, 38, 58, 0.94); border: 1px solid var(--line-2);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
    transition: opacity 0.3s, transform 0.3s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .notice {
    position: fixed; top: 128px; left: 50%; z-index: 8; width: min(560px, calc(100% - 32px));
    transform: translate(-50%, -8px); opacity: 0; pointer-events: none;
    padding: 16px 20px; border-radius: 16px; text-align: center;
    background: rgba(32, 40, 60, 0.96); border: 1px solid rgba(201, 169, 107, 0.28);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.4);
    font-size: 14px; font-weight: 300; line-height: 1.7; color: var(--ink); word-break: keep-all;
    transition: opacity 0.3s, transform 0.3s;
  }
  .notice.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .notice .acts { margin-top: 12px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .veil {
    position: fixed; inset: 0; z-index: 20; display: none;
    align-items: center; justify-content: center; flex-direction: column; gap: 14px;
    background: rgba(13, 18, 32, 0.86); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    font-size: 17px; font-weight: 200; letter-spacing: 0.06em;
  }
  .veil small { font-size: 13px; color: var(--muted); font-weight: 300; }
  body.quitting .veil { display: flex; }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes breathe {
    0%, 100% { box-shadow: 0 0 0 0 rgba(196, 106, 92, 0); }
    50% { box-shadow: 0 0 0 11px rgba(196, 106, 92, 0.1); }
  }

  @media (max-width: 520px) {
    .cuechip { top: 106px; }
    .top { padding-top: 34px; }
    main { padding-top: 136px; padding-bottom: 216px; }
    .ghost { min-width: 0; padding: 9px 14px; font-size: 13px; }
    .rec { width: 68px; height: 68px; }
    .row2 { gap: 14px; }
    .notice { top: 118px; }
  }
</style>
</head>
<body class="engine-loading">
  <header class="top">
    <div class="brand">강의 받아쓰기</div>
    <div class="status"><span class="dot"></span><span id="status">엔진 준비 중</span><span class="sep">·</span><span id="timer"></span></div>
    <div class="meter"><i id="meter"></i></div>
  </header>

  <main id="scroller">
    <div class="empty" id="empty">
      <svg class="wave" viewBox="0 0 120 36" aria-hidden="true">
        <path d="M2 18 C 12 18, 14 6, 22 6 S 32 30, 40 30 S 50 10, 58 10 S 66 24, 74 24 S 84 14, 92 14 S 104 18, 118 18" />
      </svg>
      <h1>강의 영상을 재생하고<br>시작을 눌러 주세요</h1>
      <p class="hint">이 Mac에서 나오는 소리를 그대로 받아 적어요. 마이크는 쓰지 않아요.<br>녹음과 받아 적은 글은 ‘기록 폴더’에 자동으로 저장돼요.</p>
      <div class="dl"><div class="dlbar"><i id="dlfill"></i></div><span id="dltext">AI 모델 내려받는 중</span></div>
    </div>
    <article id="transcript" aria-live="polite"></article>
  </main>

  <button class="latest" id="latest">↓ 최신 문장으로</button>
  <button class="cuechip" id="cuechip"></button>
  <div class="toast" id="toast"></div>
  <div class="notice" id="notice"><div id="noticeText"></div><div class="acts" id="noticeActs"></div></div>
  <div class="panel" id="kwpanel">
    <div class="card">
      <h2>중요 단어</h2>
      <p>이 단어가 들어간 문장은 밑줄로 표시되고, 저장 파일과 전체 복사 끝에 ‘중요 문장’으로 모아져요. 쉼표로 구분해 주세요.</p>
      <textarea id="kwtext" spellcheck="false"></textarea>
      <div class="acts">
        <button class="ghost small" id="kwdefault">기본값</button>
        <button class="ghost small" id="kwcancel">취소</button>
        <button class="ghost small" id="kwsave">저장</button>
      </div>
    </div>
  </div>
  <div class="veil"><div>저장하는 중</div><small>받아 적은 글과 녹음을 정리하고 있어요</small></div>

  <footer class="dock">
    <div class="row">
      <button class="ghost" id="copy" disabled>전체 복사</button>
      <div class="recwrap">
        <button class="rec" id="rec" disabled aria-label="녹음 시작"><span class="core"></span></button>
        <span class="reclabel" id="reclabel">준비 중</span>
      </div>
      <button class="ghost" id="folder">기록 폴더</button>
    </div>
    <div class="row2">
      <label class="toggle"><input type="checkbox" id="ts" checked><span class="sw"></span><span>시간 표시</span></label>
      <span class="dotsep">·</span>
      <button class="link" id="file" disabled>파일 불러오기</button>
      <span class="dotsep">·</span>
      <button class="link" id="kw">중요 단어</button>
    </div>
  </footer>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const body = document.body;
  const native = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.native;
  const state = { engine: "loading", rec: "idle", mode: "live", started: 0, title: "", segs: new Map(),
                  saved: null, timer: null, follow: true,
                  idBase: 0,             // segment ids restart in every backend session
                  resumePending: false,  // engine restarted mid-lecture: start again when ready
                  resuming: false };

  function send(cmd, extra = {}) {
    if (native) native.postMessage({ cmd, ...extra });
    else demo.handle(cmd, extra);
  }

  // ---------- helpers
  const fmt = (sec) => {
    sec = Math.max(0, Math.floor(sec));
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    const mm = String(m).padStart(2, "0"), ss = String(s).padStart(2, "0");
    return h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
  };
  const human = (sec) => {
    sec = Math.round(sec);
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    return h ? `${h}시간 ${m}분` : m ? `${m}분 ${s}초` : `${s}초`;
  };
  let toastTimer;
  function toast(msg, ms = 2600) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), ms);
  }
  function notice(msg, actions = []) {
    $("noticeText").textContent = msg;
    const acts = $("noticeActs");
    acts.innerHTML = "";
    for (const [label, fn] of [...actions, ["닫기", null]]) {
      const b = document.createElement("button");
      b.className = "ghost small";
      b.textContent = label;
      b.onclick = () => { $("notice").classList.remove("show"); fn && fn(); };
      acts.appendChild(b);
    }
    $("notice").classList.add("show");
  }
  function setStatus(text) { $("status").textContent = text; }

  // ---------- rendering
  function refreshControls() {
    const ready = state.engine === "ready";
    const busy = state.rec !== "idle";
    $("rec").disabled = !ready || state.rec === "finishing";
    $("file").disabled = !ready || busy;
    $("copy").disabled = !finalLines().length;
    const failed = state.engine === "error" && state.retryable;
    if (failed) $("rec").disabled = false;           // becomes a retry button
    const label = state.rec === "recording" ? (state.mode === "file" ? "중지" : "정지")
                : state.rec === "finishing" ? "저장 중" : ready ? "시작" : failed ? "다시 시도" : "준비 중";
    $("reclabel").textContent = label;
    $("rec").setAttribute("aria-label", state.rec === "recording" ? "녹음 정지" : "녹음 시작");
    body.classList.toggle("engine-ready", ready);
    body.classList.toggle("engine-loading", state.engine === "loading");
    body.classList.toggle("recording", state.rec === "recording");
    body.classList.toggle("finishing", state.rec === "finishing");
    body.classList.toggle("has-text", state.segs.size > 0 || !!state.saved);
  }

  function nearBottom() {
    const s = $("scroller");
    return s.scrollHeight - s.scrollTop - s.clientHeight < 140;
  }
  function scrollToEnd() {
    const s = $("scroller");
    s.scrollTop = s.scrollHeight;
    $("latest").classList.remove("show");
  }

  function upsertSeg(ev) {
    const follow = nearBottom();
    const key = state.idBase + ev.id;
    let seg = state.segs.get(key);
    if (ev.final && !ev.text) {             // dropped (noise / no speech)
      if (seg) { seg.el.remove(); state.segs.delete(key); }
      refreshControls();
      return;
    }
    if (!seg) {
      const el = document.createElement("section");
      el.className = "seg";
      el.innerHTML = "<time></time><p></p>";
      seg = { id: key, el };
      state.segs.set(key, seg);
      // keep DOM order by id
      const after = [...state.segs.values()].filter((s) => s.id > key && s.el.isConnected)
                                             .sort((a, b) => a.id - b.id)[0];
      $("transcript").insertBefore(el, after ? after.el : null);
    }
    seg.t = ev.t; seg.text = ev.text; seg.final = ev.final;
    seg.el.classList.toggle("interim", !ev.final);
    seg.el.classList.toggle("cue", ev.final && CUE.test(ev.text));
    if (ev.final) refreshCues();
    seg.el.querySelector("time").textContent = fmt(ev.t);
    seg.el.querySelector("p").textContent = ev.text;
    refreshControls();
    if (follow) requestAnimationFrame(scrollToEnd);
    else if (state.rec === "recording") $("latest").classList.add("show");
  }

  // Sentences containing a user-chosen "중요 단어" (출석, 시험, 과제 …) get marked and collected.
  const DEFAULT_KEYWORDS = ["출석", "시험", "과제", "퀴즈", "키워드", "암호", "비밀번호", "오늘의 단어", "확인 단어",
                            "attendance", "exam", "quiz", "assignment", "keyword", "password"];
  let keywords = DEFAULT_KEYWORDS.slice();
  let pendingKwToast = false;
  let CUE = buildCue(keywords);
  function buildCue(words) {
    const esc = (x) => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    // same rules as the engine: Korean inside words, Latin script as whole words (+ plurals)
    const parts = words.map((w) => w.trim()).filter(Boolean).map((w) => {
      const body = w.split(/\s+/).map(esc).join("\\s?");
      return /^[A-Za-z0-9 .'-]+$/.test(w) ? `(?<![A-Za-z0-9])${body}(?:s|es)?(?![A-Za-z0-9])` : body;
    });
    return parts.length ? new RegExp(parts.join("|"), "i") : /(?!)/;
  }
  function applyKeywords(words) {
    keywords = words;
    CUE = buildCue(words);
    for (const s of state.segs.values()) s.el.classList.toggle("cue", !!(s.final && CUE.test(s.text)));
    refreshCues();
  }
  let cueIndex = -1;
  function cueLines() { return finalLines().filter((s) => CUE.test(s.text)); }
  function refreshCues() {
    const cues = cueLines();
    const chip = $("cuechip");
    if (!cues.length) { chip.classList.remove("show"); return; }
    const last = cues[cues.length - 1];
    chip.textContent = `중요 문장${cues.length > 1 ? " " + cues.length : ""} · ${fmt(last.t)} — ${last.text}`;
    chip.classList.add("show");
  }
  function jumpToCue() {
    const cues = cueLines();
    if (!cues.length) return;
    cueIndex = (cueIndex + 1) % cues.length;
    const el = cues[cues.length - 1 - cueIndex].el;   // newest first
    el.scrollIntoView({ block: "center" });
    el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
  }

  function finalLines() {
    return [...state.segs.values()].filter((s) => s.final && s.text).sort((a, b) => a.id - b.id);
  }

  function transcriptText() {
    const withTs = $("ts").checked;
    const lines = finalLines().map((s) => (withTs ? `[${fmt(s.t)}] ` : "") + s.text);
    const head = state.title ? `${state.title}\n\n` : "";
    const cues = cueLines().map((s) => `[${fmt(s.t)}] ${s.text}`);
    const tail = cues.length ? `\n\n── 중요 문장 ──\n${cues.join("\n")}` : "";
    return head + lines.join("\n") + tail;
  }

  function clearTranscript() {
    $("cuechip").classList.remove("show");
    cueIndex = -1;
    state.segs.clear();
    state.saved = null;
    $("transcript").innerHTML = "";
  }

  function showSaved(ev) {
    state.saved = ev;
    // every final has arrived by now: drop any preview line that never got one
    for (const [id, s] of [...state.segs]) if (!s.final) { s.el.remove(); state.segs.delete(id); }
    if (!ev.txt) { refreshControls(); return; }
    const box = document.createElement("div");
    box.className = "saved";
    const what = ev.audio ? "텍스트와 녹음이 저장됐어요" : "텍스트가 저장됐어요";
    box.innerHTML = `<b>저장됨</b><span>${human(ev.seconds)} · ${ev.count}문장 · ${what}</span><div class="acts"></div>`;
    const cues = cueLines().slice(-3);
    if (cues.length) {
      const c = document.createElement("div");
      c.className = "cues";
      c.innerHTML = "<em>중요 문장</em>";
      for (const s of cues) {
        const line = document.createElement("div");
        line.textContent = `${fmt(s.t)} · ${s.text}`;
        c.appendChild(line);
      }
      box.insertBefore(c, box.querySelector(".acts"));
    }
    const acts = box.querySelector(".acts");
    const add = (label, fn) => {
      const b = document.createElement("button");
      b.className = "ghost small"; b.textContent = label; b.onclick = fn; acts.appendChild(b);
    };
    add("텍스트 열기", () => send("openFile", { path: ev.txt }));
    add("폴더에서 보기", () => send("reveal", { path: ev.txt }));
    $("transcript").appendChild(box);
    refreshControls();
    requestAnimationFrame(scrollToEnd);
  }

  function tick() {
    if (state.rec === "recording" && state.mode === "live" && state.started) {
      $("timer").textContent = fmt(Date.now() / 1000 - state.started);
    }
  }

  function copyAll() {
    const lines = finalLines();
    if (!lines.length) return;
    send("copy", { text: transcriptText() });
  }

  // The backend died under an active session (the app restarts it). Its text is already on disk.
  function lostSession() {
    if (state.rec === "recording" && state.mode === "live") state.resumePending = true;
    state.rec = "idle";
    clearInterval(state.timer);
    $("timer").textContent = "";
    $("meter").style.transform = "scaleX(0)";
    for (const [k, s] of [...state.segs]) if (!s.final) { s.el.remove(); state.segs.delete(k); }
    refreshControls();
  }

  // ---------- events from the backend
  const handlers = {
    engine(ev) {
      if (ev.state === "loading" && state.rec !== "idle") lostSession();
      body.classList.toggle("downloading", ev.state === "downloading");
      if (ev.state === "downloading") {
        const pct = ev.total ? Math.floor((ev.done / ev.total) * 100) : 0;
        const mb = (x) => Math.round(x / 1e6);
        $("dlfill").style.width = pct + "%";
        $("dltext").textContent = ev.verifying ? "내려받은 파일 확인 중…"
          : `AI 모델 내려받는 중 · ${pct}% (${mb(ev.done)} / ${mb(ev.total)} MB) — 처음 한 번만`;
        setStatus(ev.verifying ? "모델 확인 중" : `모델 내려받는 중 · ${pct}%`);
        if (state.engine !== "downloading") send("log", { msg: "ui engine=downloading" });
        state.engine = "downloading";
        refreshControls();
        return;
      }
      state.retryable = !!ev.retry;
      if (ev.state === "loading") pendingKwToast = false;   // a save sent during a restart was dropped
      if (ev.state === "error" && ev.retry) {
        notice(ev.msg || "엔진을 시작하지 못했어요.", [["다시 시도", () => send("retry")]]);
      }
      state.engine = ev.state;
      send("log", { msg: `ui engine=${ev.state}` });
      if (state.rec === "idle") setStatus(ev.state === "ready" ? "준비됨" : ev.msg || "엔진 준비 중");
      if (ev.state === "error") setStatus(ev.msg || "엔진 오류");
      refreshControls();
      if (ev.state === "ready" && state.resumePending) {
        state.resumePending = false;
        state.resuming = true;
        notice("엔진이 잠깐 멈춰서 다시 켰어요. 지금까지 받아 적은 글은 파일에 저장돼 있고, 이어서 받아 적고 있어요.");
        send("start");
      }
    },
    rec(ev) {
      const prev = state.rec;
      state.rec = ev.state;
      if (ev.state === "recording") {
        state.idBase += 100000;
        if (state.resuming) {
          const d = document.createElement("div");
          d.className = "divider";
          d.textContent = "엔진 재시작 · 여기서부터 새 파일에 이어서 저장";
          $("transcript").appendChild(d);
        } else if (prev === "idle") {
          clearTranscript();
        }
        state.mode = ev.mode || "live";
        if (!state.resuming || !state.title) state.title = ev.header || ev.title || "";
        state.resuming = false;
        state.started = ev.started || Date.now() / 1000;
        state.follow = true;
        $("notice").classList.remove("show");
        setStatus(state.mode === "file" ? "파일 받아 적는 중" : "받아 적는 중");
        $("timer").textContent = state.mode === "file" ? "0%" : "00:00";
        clearInterval(state.timer);
        state.timer = setInterval(tick, 500);
      } else if (ev.state === "finishing") {
        setStatus("마무리 중");
        clearInterval(state.timer);
      } else {
        clearInterval(state.timer);
        $("timer").textContent = "";
        $("meter").style.transform = "scaleX(0)";
        setStatus(state.engine === "ready" ? "준비됨" : "엔진 준비 중");
      }
      refreshControls();
    },
    level(ev) { $("meter").style.transform = `scaleX(${Math.min(1, ev.v * 1.25).toFixed(3)})`; },
    seg: upsertSeg,
    progress(ev) {
      if (state.rec === "finishing") {
        $("timer").textContent = ev.pending ? `남은 문장 ${ev.pending}` : "";
      } else if (state.mode === "file" && ev.done != null) {
        $("timer").textContent = `${Math.round(ev.done * 100)}%`;
      }
    },
    saved(ev) {
      showSaved(ev);
      send("log", { msg: `ui rendered ${finalLines().length} final lines, ${transcriptText().length} chars; saved=${ev.txt ? "yes" : "no"}` });
      if (ev.txt) toast(`저장됨 · ${ev.count}문장`);
    },
    copied(ev) {
      toast(`복사됨 · ${finalLines().length}문장 — 다른 AI 창에 붙여 넣으세요`, 3200);
    },
    notice(ev) {
      if (ev.code === "no_input") {
        notice("아직 소리가 들어오지 않아요. 강의 영상을 재생해 주세요. "
             + "영상이 재생 중인데도 이 메시지가 계속 보이면 ‘시스템 오디오 녹음’ 권한에서 강의 받아쓰기를 허용해 주세요.",
               [["권한 설정 열기", () => send("openPrivacy")]]);
      } else if (ev.code === "backend_restart") {
        lostSession();
        toast(ev.msg || "엔진을 다시 시작하는 중이에요.", 3200);
      } else if (["disk", "disk_low", "tap_gave_up", "engine_wake"].includes(ev.code)) {
        notice(ev.msg);
      } else if (ev.code === "no_audio") {
        notice("20초째 소리가 들어오지 않아요. 강의 영상이 재생 중인지 확인해 주세요. "
             + "처음 쓰는 거라면 ‘시스템 오디오 녹음’ 권한에서 강의 받아쓰기를 허용해야 해요.",
               [["권한 설정 열기", () => send("openPrivacy")]]);
      } else if (ev.code === "tap_error") {
        notice("이 Mac의 소리를 가져오지 못했어요. " + (ev.msg || ""), [["권한 설정 열기", () => send("openPrivacy")]]);
      } else if (ev.msg) {
        toast(ev.msg, 3200);
      }
    },
    settings(ev) {
      if (Array.isArray(ev.keywords)) applyKeywords(ev.keywords);
      if (pendingKwToast && Array.isArray(ev.keywords)) {
        pendingKwToast = false;
        toast(ev.keywords.length ? `중요 단어 ${ev.keywords.length}개 저장됨` : "중요 단어를 모두 지웠어요");
      }
      if (typeof ev.timestamps === "boolean") {
        $("ts").checked = ev.timestamps;
        body.classList.toggle("no-ts", !ev.timestamps);
      }
    },
    quitting() { body.classList.add("quitting"); },
    bye() {},
  };

  window.app = {
    receive(ev) {
      try { (handlers[ev.ev] || (() => {}))(ev); }
      catch (e) { send("log", { msg: String(e && e.stack || e) }); }
    },
  };
  window.addEventListener("error", (e) => send("log", { msg: `${e.message} @${e.lineno}` }));

  // ---------- controls
  $("rec").onclick = () => {
    if (state.engine === "error" && state.retryable) { $("notice").classList.remove("show"); send("retry"); }
    else if (state.rec === "recording") send("stop");
    else if (state.rec === "idle") send("start");
  };
  $("copy").onclick = copyAll;
  $("folder").onclick = () => send("openFolder");
  $("file").onclick = () => send("pickFile");
  $("latest").onclick = scrollToEnd;
  $("cuechip").onclick = jumpToCue;
  $("ts").onchange = () => {
    body.classList.toggle("no-ts", !$("ts").checked);
    send("settings", { timestamps: $("ts").checked });
  };
  // 중요 단어 editor
  $("kw").onclick = () => { $("kwtext").value = keywords.join(", "); $("kwpanel").classList.add("show"); $("kwtext").focus(); };
  $("kwcancel").onclick = () => $("kwpanel").classList.remove("show");
  $("kwdefault").onclick = () => { $("kwtext").value = DEFAULT_KEYWORDS.join(", "); };
  $("kwsave").onclick = () => {
    const words = $("kwtext").value.split(/[,\n]/).map((w) => w.trim()).filter(Boolean);
    pendingKwToast = true;
    send("settings", { keywords: words });
    $("kwpanel").classList.remove("show");
  };
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("kwpanel").classList.remove("show"); });
  $("scroller").addEventListener("scroll", () => { if (nearBottom()) $("latest").classList.remove("show"); });
  document.addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key.toLowerCase() === "c") { e.preventDefault(); copyAll(); }
  });
  // Let file drops fall through to the app (it transcribes dropped audio/video files).
  document.addEventListener("dragover", (e) => { if (!native) e.preventDefault(); });

  // ---------- demo mode (opened in a normal browser, for design preview only)
  const demo = {
    timers: [],
    lines: [
      "여러분 안녕하세요. 오늘 강의에서는 수요와 공급의 기본 원리를 함께 살펴보겠습니다.",
      "가격이 오르면 수요량은 줄어들고, 공급량은 늘어납니다.",
      "두 곡선이 만나는 점이 바로 시장 균형입니다.",
      "여러분, 우리는 매일 수많은 선택을 하며 살아갑니다. 모든 선택에는 기회비용이 있습니다.",
      "잠깐, 지금 이 강의를 듣고 계신 분들은 오늘의 단어 코끼리를 기억해 주세요.",
      "다음 주 수요일까지 과제를 제출해 주시고, 중간고사 범위는 4장까지입니다.",
    ],
    handle(cmd) {
      const emit = (ev) => window.app.receive(ev);
      if (cmd === "ready") setTimeout(() => emit({ ev: "engine", state: "ready" }), 700);
      if (cmd === "start") {
        emit({ ev: "rec", state: "recording", mode: "live", started: Date.now() / 1000, title: "2026-10-04 16시30분 강의" });
        let t = 0, id = 1;
        this.timers.push(setInterval(() => emit({ ev: "level", v: 0.35 + Math.random() * 0.5 }), 120));
        const next = () => {
          const line = this.lines[(id - 1) % this.lines.length];
          const half = line.slice(0, Math.ceil(line.length * 0.55));
          const myId = id++, t0 = t;
          emit({ ev: "seg", id: myId, t: t0, text: half, final: false });
          this.timers.push(setTimeout(() => emit({ ev: "seg", id: myId, t: t0, text: line, final: true }), 1400));
          t += 5 + Math.random() * 6;
        };
        next();
        this.timers.push(setInterval(next, 2600));
      }
      if (cmd === "stop") {
        this.timers.forEach((x) => { clearInterval(x); clearTimeout(x); });
        this.timers = [];
        emit({ ev: "rec", state: "finishing" });
        setTimeout(() => {
          emit({ ev: "saved", txt: "/demo.txt", audio: "/demo.m4a", seconds: 1874, count: finalLines().length });
          emit({ ev: "rec", state: "idle" });
        }, 900);
      }
      if (cmd === "copy") setTimeout(() => window.app.receive({ ev: "copied" }), 50);
      if (cmd === "settings") window.app.receive({ ev: "settings", ...arguments[1] });
    },
    still() {   // ?shot — a frozen, populated frame for the README screenshot
      const emit = (ev) => window.app.receive(ev);
      emit({ ev: "engine", state: "ready" });
      emit({ ev: "rec", state: "recording", mode: "live", started: Date.now() / 1000 - 1421, title: "" });
      const lines = [
        [1312, "두 곡선이 만나는 점이 바로 시장 균형입니다."],
        [1318, "여러분, 우리는 매일 수많은 선택을 하며 살아갑니다. 커피 한 잔을 살지, 버스를 탈지 택시를 탈지, 모든 선택에는 기회비용이 있습니다."],
        [1329, "It is not from the benevolence of the butcher that we expect our dinner."],
        [1336, "다음 주 수요일까지 과제를 제출해 주시고, 중간고사 범위는 4장까지입니다."],
        [1343, "마지막으로 한 가지를 더 부탁드립니다. 오늘 출석 확인 문구는 푸른 하늘 은하수입니다."],
      ];
      lines.forEach(([t, text], i) => emit({ ev: "seg", id: i + 1, t, text, final: true }));
      emit({ ev: "level", v: 0.62 });
      setTimeout(() => { clearInterval(state.timer); $("timer").textContent = "23:41"; }, 50);
    },
  };

  refreshControls();
  send("ready");
  if (!native && location.search.includes("shot")) demo.still();
})();
</script>
</body>
</html>
